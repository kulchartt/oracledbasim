# Publishes landing/ (TH at /, EN at /en/) to GitHub Pages:
# https://kulchartt.github.io/oracledbasim/
name: pages

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # deploy-pages lists this run's artifacts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs on purpose: deploying in the same job as the upload found
  # "0 artifacts" (the artifact is listed only once its job has finished).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
